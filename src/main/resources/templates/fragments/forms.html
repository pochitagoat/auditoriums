<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><body>
<label class="field" th:fragment="fieldInput(label, field, value, type, required, max, min)">
    <span th:text="${label} + (${required} ? ' *' : '')"></span>
    <input th:name="${field}" th:type="${type}" th:value="${value}" th:required="${required}"
           th:maxlength="${max}" th:min="${min}" th:step="${field == 'area' ? 'any' : null}">
    <span class="field-error" th:attr="data-field-error=${field}"></span>
</label>
<label class="field full" th:fragment="text(label, field, value, max)">
    <span th:text="${label}"></span><textarea th:name="${field}" th:maxlength="${max}" rows="3" th:text="${value}"></textarea>
    <span class="field-error" th:attr="data-field-error=${field}"></span>
</label>
<label class="field" th:fragment="bool(label, field, value)">
    <span th:text="${label}"></span>
    <select th:name="${field}" data-type="boolean">
        <option value="" th:selected="${value == null}">Не указано</option>
        <option value="true" th:selected="${value == true}">Да</option>
        <option value="false" th:selected="${value == false}">Нет</option>
    </select>
    <span class="field-error" th:attr="data-field-error=${field}"></span>
</label>
<div class="operation" th:fragment="operation(version)">
    <input th:if="${version != null}" type="hidden" name="version" th:value="${version}" data-type="number">
    <span class="field-error" data-field-error="version"></span>
    <span class="field-error" data-field-error="auditoriumVersion"></span>
    <label class="field"><span>Ваше ФИО *</span><input name="changedBy" required maxlength="255" autocomplete="name" placeholder="Укажите автора изменения"><span class="field-error" data-field-error="changedBy"></span></label>
    <p class="form-error" role="alert" tabindex="-1" hidden></p>
</div>
<noscript th:fragment="noscript"><p class="notice warning">Для сохранения изменений включите JavaScript в браузере.</p></noscript>
</body></html>
