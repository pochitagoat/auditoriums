<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Вход')}"></head><body><main class="auth-page"><section class="panel editor"><h1>Вход сотрудника</h1><p class="subtitle">Войдите, чтобы редактировать аудитории и оборудование.</p><p class="notice success" th:if="${param.registered != null}">Аккаунт создан. Теперь войдите.</p><p class="notice warning" th:if="${param.error != null}">Неверно указаны ФИО или пароль.</p><form method="post" th:action="@{/login}"><label class="field"><span>ФИО</span><input name="username" autocomplete="name" placeholder="Фамилия Имя Отчество" required autofocus></label><label class="field"><span>Пароль</span><input type="password" name="password" autocomplete="current-password" required></label><div class="form-actions"><button class="button primary" type="submit">Войти</button><a class="button" th:href="@{/register}">Зарегистрироваться</a></div></form></section></main></body></html>
