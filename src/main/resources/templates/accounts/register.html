<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Регистрация')}"></head><body><main class="auth-page"><section class="panel editor"><h1>Регистрация сотрудника</h1><form method="post" th:action="@{/register}" th:object="${registration}"><div class="form-grid"><label class="field"><span>Фамилия</span><input th:field="*{lastName}" autocomplete="family-name" required><span class="field-error" th:errors="*{lastName}"></span></label><label class="field"><span>Имя</span><input th:field="*{firstName}" autocomplete="given-name" required><span class="field-error" th:errors="*{firstName}"></span></label><label class="field"><span>Отчество</span><input th:field="*{middleName}" autocomplete="additional-name" required><span class="field-error" th:errors="*{middleName}"></span></label></div><label class="field"><span>Должность</span><input th:field="*{position}" autocomplete="organization-title" required><span class="field-error" th:errors="*{position}"></span></label><label class="field"><span>Пароль</span><input type="password" th:field="*{password}" autocomplete="new-password" required><span class="field-error" th:errors="*{password}"></span></label><div class="form-actions"><button class="button primary" type="submit">Создать аккаунт</button><a class="button" th:href="@{/login}">Войти</a></div></form></section></main></body></html>
