spring.application.name=auditoriums
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auditoriums_db}
spring.datasource.username=${DB_USERNAME:auditoriums}
spring.datasource.password=${DB_PASSWORD}

# Схему создаёт Flyway; Hibernate проверяет соответствие сущностей.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

app.time-zone=${APP_TIME_ZONE:Europe/Moscow}
app.storage.root=${PHOTO_STORAGE_ROOT:./data/photos}
app.storage.cleanup-delay-ms=${PHOTO_CLEANUP_DELAY_MS:60000}
spring.servlet.multipart.max-file-size=10000000B
spring.servlet.multipart.max-request-size=11000000B

# DTO принимают только разрешенные поля и целые числа в целочисленных полях.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
